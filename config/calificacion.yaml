# Campos que releva el agente.
#
# PROVISORIO en cuanto a los pesos: los criterios comerciales salen del kick
# off con el cliente y hasta entonces no hay scoring. Lo que si esta confirmado
# son los campos y sus valores, que se derivan de la lista de precios y de las
# reglas de venta reales.
#
# `guardar_dato` valida contra esta lista. Un campo que no este aca se rechaza,
# para que `conversaciones.datos` no se convierta en un cajon de sastre donde
# cada conversacion guarda claves distintas.

campos:
  nombre:
    descripcion: "Como se llama la persona. Se pide al principio y se usa despues"
    tipo: texto
    requerido: false

  linea:
    descripcion: "Arquitectonico (vidrio de inmuebles) o vehicular (autos)"
    valores: [arquitectonico, vehicular]
    requerido: true

  zona:
    descripcion: "Donde se hace el trabajo. Define el minimo de venta y el precio"
    valores: [quito_y_valles, otra_ciudad, fuera_del_pais]
    requerido: true

  objetivo:
    descripcion: "Que necesita resolver. Mapea uno a uno con el producto"
    valores: [control_solar, privacidad, seguridad]
    requerido: true

  aplicacion:
    descripcion: "Donde se instala"
    valores: [domicilio, oficina, pergola, local, vehiculo]
    requerido: false

  metros_cuadrados:
    descripcion: "Metros cuadrados aproximados. Habilita la cotizacion"
    tipo: numero
    requerido: false   # obligatorio solo en la linea arquitectonica

  medidas_detalle:
    descripcion: "Como lo describio el cliente: cantidad de ventanas, medidas, si mando fotos"
    tipo: texto
    requerido: false

  garantia_anios:
    descripcion: "Garantia del material elegida. Cambia el precio"
    valores: [10, 5]
    requerido: false   # solo control solar y privacidad

  modelo_vehiculo:
    descripcion: "Modelo del auto. Define el tipo de vehiculo y la cantidad de material"
    tipo: texto
    requerido: false   # obligatorio en la linea vehicular

  telefono:
    descripcion: "Telefono de contacto en formato internacional"
    tipo: texto
    requerido: true

  disponibilidad:
    # Es para el LLAMADO, no para la visita: la visita la coordina el asesor por
    # telefono. La descripcion es lo que ve el modelo, y decir "visita tecnica"
    # aca lo llevaba a preguntar por algo que despues no puede agendar.
    #
    # Dia y hora, tal como lo diga la persona: "el jueves por la mañana" o
    # "manana despues de las 3". No se normaliza, porque es lo que el asesor va
    # a leer antes de marcar.
    descripcion: "Que dia y en que horario prefiere que lo llame un asesor"
    tipo: texto
    requerido: false

  tipo_cliente:
    descripcion: "Particular, empresa, o constructora/arquitecto"
    valores: [particular, empresa, constructora_o_arquitecto]
    requerido: false

  urgencia:
    descripcion: "Cuando lo necesita"
    valores: [inmediato, semanas, explorando]
    requerido: false

# Campos sin los cuales la calificacion no sirve, segun la linea. El handoff es
# telefonico: sin telefono no hay a quien llamar, por mas completo que este el
# resto.
# `disponibilidad` es requerida por una razon operativa, no de puntaje: sin ella
# el agente cerraba, sincronizaba, y despues el cliente contestaba el horario y
# volvia a cerrar. El lead entraba al tablero con un puntaje y a los sesenta
# segundos con otro, dejando dos notas. Pedirla antes de cerrar hace que el
# cierre ocurra una sola vez.
requeridos_por_linea:
  arquitectonico: [linea, zona, objetivo, metros_cuadrados, telefono, disponibilidad]
  vehicular: [linea, zona, modelo_vehiculo, telefono, disponibilidad]

# ---------------------------------------------------------------------------
# Puntaje
#
# PROVISORIO. Los pesos son una hipotesis armada con las reglas de negocio que
# el cliente si confirmo (minimos de venta por zona, que vehicular no se cotiza
# por chat, que fuera de Ecuador se descarta). Los valores relativos —cuanto
# vale la urgencia contra el tamaño del trabajo, por ejemplo— salen del kick
# off, y hasta entonces son una conjetura.
#
# Recalibrar es editar este archivo. No se toca codigo ni se vuelve a desplegar.
#
# Los tramos de metros se evaluan de arriba hacia abajo: gana el primero cuyo
# `desde` se cumpla.
# ---------------------------------------------------------------------------
pesos:
  zona:
    quito_y_valles: 20      # minimo de 5 m2, precio estandar
    otra_ciudad: 8          # minimo de 20 m2 y recargo: mucha mas friccion
    fuera_del_pais: 0

  metros_cuadrados:
    - {desde: 40, puntos: 25}
    - {desde: 20, puntos: 16}
    - {desde: 10, puntos: 10}
    - {desde: 0, puntos: 4}

  urgencia:
    inmediato: 20
    semanas: 12
    explorando: 3

  tipo_cliente:
    constructora_o_arquitecto: 20   # el lead de mayor valor, a confirmar
    empresa: 15
    particular: 8

  linea:
    arquitectonico: 5       # el nucleo del negocio
    vehicular: 3            # linea secundaria

  # Que haya dicho cuando puede es señal de intencion, y ademas es lo que el
  # vendedor necesita para llamar.
  disponibilidad_presente: 5

# Un caso ideal —constructora, trabajo grande, urgente, en Quito— llega a 95.
umbrales:
  alta: 70
  media: 45
