      Imbabura: [Ibarra, Otavalo, Atuntaqui, Cotacachi, Pimampiro, Urcuquí, San Pablo del Lago]
      Bolívar: [Guaranda, San José de Chimbo, San Miguel, Caluma, Echeandía, Chillanes, Las Naves]
      Cotopaxi: [Latacunga, La Maná, Salcedo, Pujilí, Saquisilí, Sigchos, Zumbahua]
      Napo: [Tena, Archidona, El Chaco, Baeza, Carlos Julio Arosemena Tola, Quijos]
      Tungurahua: [Ambato, Baños de Agua Santa, Pelileo, Píllaro, Quero, Tisaleo, Cevallos, Mocha]
      Santo Domingo de los Tsáchilas:
        [Santo Domingo, La Concordia, Valle Hermoso, Luz de América, Alluriquín]

  zona_verde:
    provincias:
      Chimborazo: [Riobamba, Guano, Alausí, Chambo, Colta, Guamote, Cumandá, Pallatanga, Chunchi]
      Cañar: [Azogues, La Troncal, Cañar, Biblián, El Tambo, Déleg, Suscal]
      Azuay:
        [Cuenca, Gualaceo, Paute, Santa Isabel, Sígsig, Girón, Camilo Ponce Enríquez,
         Chordeleg, Nabón]
      Guayas:
        [Guayaquil, Durán, Milagro, Daule, Samborondón, Playas, El Triunfo, Balzar,
         Naranjal, Yaguachi, Pedro Carbo, Salitre, General Villamil, Colimes]
      Los Ríos:
        [Babahoyo, Quevedo, Buena Fe, Ventanas, Valencia, Vinces, Puebloviejo, Mocache,
         Baba, Montalvo, Palenque, Urdaneta]
      Manabí:
        [Portoviejo, Manta, Chone, Jipijapa, Montecristi, El Carmen, Bahía de Caráquez,
         Pedernales, Rocafuerte, Sucre, Tosagua, Paján, Puerto López, Calceta, Jama]
      Esmeraldas: [Esmeraldas, Quinindé, Atacames, San Lorenzo, Muisne, Tonsupa, Same, Borbón]

  zona_roja:
    provincias:
      Carchi: [Tulcán, San Gabriel, El Ángel, Huaca, Mira]
      Sucumbíos:
        [Nueva Loja, Lago Agrio, Shushufindi, Cuyabeno, Gonzalo Pizarro, Cascales,
