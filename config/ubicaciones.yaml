  # No se atiende (confirmado por el cliente el 29/9/2026). No figura en ninguna
  # zona del documento, y sin esto caeria en "no la encontre" en vez de descarte.
  galapagos:
    provincias:
      Galápagos:
        [Puerto Ayora, Puerto Baquerizo Moreno, Santa Cruz, San Cristóbal, Isabela,
         Floreana, Baltra]
