      Orellana: [El Coca, La Joya de los Sachas, Loreto, Nuevo Rocafuerte, Dayuma]
      Pastaza: [Puyo, Shell, Mera, Santa Clara, Arajuno]
      Morona Santiago:
        [Macas, Sucúa, Gualaquiza, Limón Indanza, Santiago de Méndez, Palora,
