# Donde queda cada ciudad, para saber que zona de precios le corresponde.
#
# Sale del documento "UBICACIONES Y PRECIOS MS 2027" del cliente (29/9/2026).
# Antes no hacia falta: con dos zonas, "Quito o no Quito" lo resolvia el modelo.
# Con cinco zonas y minimos de 5 a 25 m2, la ubicacion decide el precio, y eso
# no lo puede adivinar: se busca aca.
#
# Se indexa por provincia Y por ciudad, porque la gente dice las dos cosas
# ("estoy en Azuay", "es en Gualaceo"). La comparacion ignora tildes y
# mayusculas (app/ubicaciones.py).
#
# Al agregar una ciudad, alcanza con ponerla en la lista de su provincia.

zonas:
  quito_y_valles:
    provincias:
      # Solo Quito y los valles que el cliente marco en amarillo. El resto de
      # Pichincha es `pichincha_cercana`, con minimo 10 y precios mas altos.
      Pichincha:
        - Quito
        - Cumbayá
        - Tumbaco
        - Puembo
        - Pifo
        - Tababela
        - Checa
        - Conocoto
        - La Armenia
        - La Merced
        - Sangolquí
        - Amaguaña

  pichincha_cercana:
    provincias:
      Pichincha:
        # Zona norte
        - Guayllabamba
        - Malchinguí
        - Perucho
        - Tabacundo
        - Cayambe
        # Zona noroccidente
        - Nanegalito
        - Mindo
        - San Miguel de los Bancos
        - Pedro Vicente Maldonado
        - Puerto Quito
        # Zona sur
        - Tambillo
        - Machachi
        - Aloag

  zona_azul:
