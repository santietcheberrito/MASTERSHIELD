      Zamora Chinchipe:
        [Zamora, Yantzaza, Zumba, El Pangui, Centinela del Cóndor, Palanda, Guayzimi,
         Paquisha]
      El Oro:
        [Machala, Santa Rosa, Pasaje, Huaquillas, El Guabo, Zaruma, Piñas, Arenillas,
