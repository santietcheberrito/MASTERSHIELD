# Productos de MasterShield(R), precios y reglas de venta.
#
# Datos entregados por el cliente. Lo que esta en null falta confirmar, y
# `calcular_precio` se niega a cotizar cuando falta algo que afecte el numero:
# un precio equivocado dicho a un cliente real es peor que no dar precio.
#
# Los nombres de producto salen del sitio del cliente. No usar sinonimos: el
# agente los tiene que nombrar igual que la empresa, y nunca "polarizado".

moneda: USD
iva_porcentaje: 15

# TODOS los precios de este archivo son SIN IVA. El cliente pidio explicitamente
# que el agente los exprese con la frase "mas IVA", no que los sume por su
# cuenta: asi el numero que dice el agente es el mismo que figura en la lista.
precios_sin_iva: true

# Descuento adicional por forma de pago, en porcentaje.
descuento_efectivo_transferencia: 10
# A CONFIRMAR: se aplica sobre el subtotal sin IVA o sobre el total con IVA?
descuento_se_aplica_sobre: null

# Que incluye el precio. Es un argumento de venta fuerte y conviene que el
# agente lo tenga a mano: no es solo el material.
# Esta es la lista del documento de septiembre de 2026, que es la que el
# cliente quiere que se diga. La version anterior sumaba "traslado del personal
# al sitio" y "alquiler de escaleras o andamios": son argumentos de venta
# fuertes y conviene confirmar si siguen incluidos antes de dejarlos afuera para
# siempre. Ver docs/consultas-al-cliente.md.
incluye:
  - material
  - mano de obra de instalacion
  - limpieza previa de la superficie de los vidrios
  - garantia y respaldo posventa

# Zonas. No son regiones geograficas: son las dos categorias con las que el
# cliente cotiza, mas el descarte. `zona` se releva con esta granularidad.
# Zonas de venta. Son las cinco categorias con las que MasterShield cotiza desde
# el documento "UBICACIONES Y PRECIOS MS 2027", mas los dos descartes.
#
# Hasta el 29/9/2026 eran dos —Quito y "otra ciudad"— con un recargo plano de
# USD 10 por m2 sobre el precio de lista. Ese modelo se termino: ahora cada zona
# tiene su propio minimo de instalacion Y su propia tabla de precios, que no
# siguen ninguna formula. En verde la calidad de 5 años pasa de 32 a 45, no a 42.
#
# Los precios van agrupados como los agrupa el cliente: control solar y
# privacidad comparten tabla, seguridad tiene la suya. Cada producto declara de
# que tabla come (`tabla_de_precios`).
#
# Verde y rojo tienen los MISMOS precios a proposito: lo que cambia es el minimo
# (20 contra 25 m2). Confirmado por el cliente el 29/9/2026.
zonas:
  quito_y_valles:
    nombre: "Quito y valles"
    color: amarillo
    atiende: true
    minimo_m2: 5
    precios:
      control_solar_y_privacidad:
        - garantia_anios: 10
          vida_util_hasta_anios: 15
          precio_normal: 42
          precio_especial: 37
        - garantia_anios: 5
          vida_util_hasta_anios: 8
          precio_normal: 32
          precio_especial: 25
      seguridad:
        - garantia_anios: 10
          precio_desde: 24

  pichincha_cercana:
    nombre: "Pichincha, zonas cercanas"
    color: amarillo
    atiende: true
    minimo_m2: 10
    precios:
      control_solar_y_privacidad:
        - garantia_anios: 10
          vida_util_hasta_anios: 15
          precio_normal: 48
          precio_especial: 39
        - garantia_anios: 5
          vida_util_hasta_anios: 8
          precio_normal: 35
          precio_especial: 29
      seguridad:
        - garantia_anios: 10
          precio_desde: 25

  zona_azul:
    nombre: "Imbabura, Bolivar, Cotopaxi, Napo, Tungurahua y Santo Domingo"
    color: azul
    atiende: true
    minimo_m2: 15
    precios:
      control_solar_y_privacidad:
        - garantia_anios: 10
          vida_util_hasta_anios: 15
          precio_normal: 52
          precio_especial: 45
        - garantia_anios: 5
          vida_util_hasta_anios: 8
          precio_normal: 39
          precio_especial: 35
      seguridad:
        - garantia_anios: 10
          precio_desde: 29

  zona_verde:
    nombre: "Chimborazo, Cañar, Azuay, Guayas, Los Rios, Manabi y Esmeraldas"
    color: verde
    atiende: true
    minimo_m2: 20
    precios:
      control_solar_y_privacidad:
        - garantia_anios: 10
          vida_util_hasta_anios: 15
          precio_normal: 55
          precio_especial: 49
        - garantia_anios: 5
          vida_util_hasta_anios: 8
          precio_normal: 45
          precio_especial: 39
      seguridad:
        - garantia_anios: 10
          precio_desde: 35

  zona_roja:
    nombre: "Carchi, Amazonia, El Oro, Loja y Santa Elena"
    color: rojo
    atiende: true
    minimo_m2: 25
    precios:
      control_solar_y_privacidad:
        - garantia_anios: 10
          vida_util_hasta_anios: 15
          precio_normal: 55
          precio_especial: 49
        - garantia_anios: 5
          vida_util_hasta_anios: 8
          precio_normal: 45
          precio_especial: 39
      seguridad:
        - garantia_anios: 10
          precio_desde: 35

  # Los dos descartes. Galapagos no aparece en ninguna zona del documento y el
  # cliente confirmo que no se atiende (29/9/2026).
  galapagos:
    nombre: "Galapagos"
    atiende: false

  fuera_del_pais:
    nombre: "Fuera de Ecuador"
    atiende: false

# El precio especial es una promocion mensual: el material del cliente lo llama
# "Precio especial SEPTIEMBRE". Vencido el mes, el especial deja de existir y
# vuelve a regir el normal.
#
# Esto se declara y el codigo lo respeta, en vez de quedar en la memoria de
# alguien: un agente ofreciendo en octubre el precio de septiembre es una
# promesa que la empresa despues tiene que sostener o desdecir.
#
# Formato AAAA-MM. Al cambiar de mes hay que actualizar esta linea y los
# valores de `precio_especial`; si no se actualiza, el agente cotiza al precio
# normal, que es el comportamiento seguro.
#
# No hace falta acordarse: `/metricas` avisa cinco dias antes de que venza, y
# despues lo repite hasta que alguien lo actualice. Y ojo: los precios se leen
# al arrancar el proceso, asi que editar este archivo sin redesplegar no cambia
# nada.
vigencia_precio_especial: "2026-09"


# Cada producto tiene su descripcion oficial en `prompts/fichas/<id>.txt`, que
# el agente manda tal cual cuando preguntan por el.
#
# `linea`, `objetivo` y `superficie` son lo que usa `precios.producto_para` para
# saber que producto corresponde a una conversacion: se filtra por esos campos
# hasta que queda uno solo. Un producto nuevo se agrega aca, sin tocar codigo.
productos:
  # Control solar son dos productos desde septiembre de 2026: uno para ventanas
  # y otro para techos de vidrio, donde el sol pega de lleno. Se distinguen por
  # `superficie`, que el agente pregunta cuando alguien pide control solar.
  - id: control_solar_ventanas
    nombre: "Lámina de Control Solar para Ventanas"
    linea: arquitectonico
    objetivo: control_solar
    superficie: ventanas
    cotizable: exacto
    # La vida util sale del texto de precios que mando MasterShield el 11/9/2026:
    # "Calidad 10 Años de Garantía (Hasta 15 años de vida útil)" y la de 5 años
    # hasta 8. El texto es el mismo para control solar y privacidad.
    tabla_de_precios: control_solar_y_privacidad

  - id: control_solar_techos
    nombre: "Lámina de Control Solar para Techos de Vidrio"
    linea: arquitectonico
    objetivo: control_solar
    superficie: techo
    # Mismo precio que ventanas, por decision del cliente. El alias hace que sea
    # el mismo dato y no una copia: al actualizar los precios de ventanas se
    # actualizan los dos. Si algun dia se separan, se reemplaza el alias por una
    # lista propia.
    cotizable: exacto
    tabla_de_precios: control_solar_y_privacidad
    # Roof Shield(R) es la instalacion por el lado exterior, para pergolas donde
    # el diseño no permite la interna. Vida util 1 a 3 años contra los 10 o 5
    # de la interna, asi que el agente recomienda siempre primero la interna.
    variante_exterior:
      nombre: "Roof Shield®"
      vida_util_anios: [1, 3]
      precio_m2: null   # A CONFIRMAR

  - id: privacidad_arquitectonica
    nombre: "Lámina de Privacidad Arquitectónica"
    linea: arquitectonico
    objetivo: privacidad
    cotizable: exacto
    tabla_de_precios: control_solar_y_privacidad

  - id: seguridad_arquitectonica
    nombre: "Lámina de Seguridad Arquitectónica"
    linea: arquitectonico
    objetivo: seguridad
    # "desde" y no "exacto": hay distintos niveles de seguridad y el grosor
    # adecuado lo sugiere un asesor segun la necesidad. El agente da un piso,
    # nunca un total cerrado.
    cotizable: desde
    tabla_de_precios: seguridad

  - id: seguridad_vehicular
    nombre: "Lámina de Seguridad Vehicular"
    linea: vehicular
    objetivo: seguridad
    # El cliente fue explicito: aca el agente NO da precios. Solo releva para
    # que un asesor se comunique. El m2 no es la unidad: el modelo de vehiculo
    # define el tipo (sedan, SUV, camioneta simple o doble cabina, furgoneta) y
    # con eso la cantidad de material y el tipo de trabajo.
    #
    # Tampoco pregunta el nivel de seguridad: los niveles no se pueden ofrecer
    # por chat, asi que preguntarlo lleva a la pregunta que sigue —"¿cuales
    # hay?"— que el agente no puede contestar. Eso lo define el asesor.
    cotizable: ninguno   # "no" a secas lo parsea YAML como booleano False
    datos_requeridos:
      - modelo_vehiculo
